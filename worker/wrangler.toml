name = "api-test-studio-sync"
main = "worker.js"
compatibility_date = "2025-01-01"
# The pg and mysql2 drivers behind /v1/db need Node APIs and TCP sockets.
compatibility_flags = ["nodejs_compat"]

# Optional: database hosts the /v1/db gateway may reach (RELAY_TOKEN also opens it).
# [vars]
# DB_ALLOW = "neon.tech,.supabase.co"

# After running `wrangler kv:namespace create STATE`, paste the returned id here.
# Example:
# [[kv_namespaces]]
# binding = "STATE"
# id = "abcdef0123456789abcdef0123456789"
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"
